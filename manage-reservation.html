<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage My Reservation — 11:Eleven Lounge</title>
<meta name="description" content="Look up or cancel your 11:Eleven Lounge reservation using your confirmation code.">
<link rel="canonical" href="https://11elevendallas.com/manage-reservation.html">
<meta name="robots" content="index, follow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --charcoal: #171213; --cream: #f7f1ea; --cream-2: #efe4d8;
    --gold: #c6a15b; --ink: #241d1d; --ink-soft: #5a4d4d;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--font-sans); line-height: 1.7; }
  a { color: var(--charcoal); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 72px 24px 96px; }
  .back { display: inline-block; margin-bottom: 40px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid rgba(36,29,29,.25); padding-bottom: 2px; }
  .back:hover { color: var(--gold); border-color: var(--gold); }
  .brand { font-family: var(--font-display); font-size: 22px; letter-spacing: .03em; color: var(--charcoal); margin-bottom: 4px; }
  .brand span { color: var(--gold); }
  h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(30px, 5vw, 40px); margin: 4px 0 8px; }
  .lead { font-size: 15px; color: var(--ink-soft); margin: 0 0 36px; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
  .field input { width: 100%; background: #fff; border: 1px solid rgba(36,29,29,.25); color: var(--ink); padding: 13px 14px; font-family: var(--font-sans); font-size: 15px; outline: none; text-transform: uppercase; letter-spacing: .06em; }
  .field input:focus { border-color: var(--gold); }
  .btn { padding: 13px 28px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; background: var(--charcoal); color: var(--cream); border: none; cursor: pointer; font-family: var(--font-sans); }
  .btn:hover { background: #2a2222; }
  .btn:disabled { opacity: .5; cursor: default; }

  .note { font-size: 13px; color: var(--ink-soft); margin-top: 14px; min-height: 18px; }
  .note.error { color: #8a2b2b; }

  .card { display: none; margin-top: 40px; border: 1px solid var(--cream-2); padding: 28px 30px; }
  .card.show { display: block; }
  .card .status { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  .card h2 { font-family: var(--font-display); font-weight: 500; font-size: 26px; margin: 0 0 4px; }
  .card .detail { font-size: 14.5px; color: var(--ink-soft); margin: 2px 0; }
  .card .cancel-btn { margin-top: 20px; padding: 11px 22px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; background: none; border: 1px solid #8a2b2b; color: #8a2b2b; cursor: pointer; font-family: var(--font-sans); }
  .card .cancel-btn:hover { background: #8a2b2b; color: #fff; }
  .card .cancelled-msg { color: #8a2b2b; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="index.html">&larr; Back to 11:Eleven</a>
    <div class="brand">11<span>:</span>Eleven</div>
    <h1>Manage my reservation</h1>
    <p class="lead">Enter the confirmation code from your booking to view or cancel it.</p>

    <form id="lookupForm">
      <div class="field">
        <label for="code">Confirmation code</label>
        <input type="text" id="code" maxlength="10" placeholder="e.g. H5CXUX" required autocomplete="off">
      </div>
      <button type="submit" class="btn" id="lookupBtn">Find my reservation</button>
      <p class="note" id="lookupNote"></p>
    </form>

    <div class="card" id="resCard">
      <p class="status" id="resStatus"></p>
      <h2 id="resName"></h2>
      <p class="detail" id="resDate"></p>
      <p class="detail" id="resParty"></p>
      <p class="detail" id="resNotes"></p>
      <button class="cancel-btn" id="cancelBtn">Cancel this reservation</button>
      <p class="cancelled-msg" id="cancelledMsg" style="display:none">This reservation has been cancelled. See you next time.</p>
    </div>
  </main>

<script src="assets/js/manage-reservation.js"></script>
</body>
</html>
