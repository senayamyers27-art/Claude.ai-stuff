<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Staff Access — 11:Eleven</title>
<!--
  Not real security — this is a client-side speed bump only. The
  correct code is visible to anyone who reads this page's source,
  so it stops casual/accidental visitors, not a determined one.
  Nothing sensitive should live behind this alone. If this ever
  needs to hold real customer, payment, or business data, put it
  behind a real backend with real auth first.
-->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0E0B0A; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  .card { width: min(320px, 86vw); text-align: center; }
  .brand { font-family: Georgia, serif; font-size: 26px; color: #F1ECE4; letter-spacing: .03em; margin-bottom: 6px; }
  .brand span { color: #C9A15A; }
  .kicker { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: rgba(241,236,228,.5); margin-bottom: 28px; }
  input {
    width: 100%; padding: 14px 16px; font-size: 15px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.18);
    color: #F1ECE4; border-radius: 2px;
  }
  input:focus { outline: none; border-color: #C9A15A; }
  button {
    width: 100%; margin-top: 14px; padding: 14px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
    background: #C9A15A; color: #0E0B0A; border: none; border-radius: 2px; cursor: pointer;
  }
  button:hover { background: #dfc590; }
  .error { display: none; margin-top: 14px; font-size: 13px; color: #e7a5a5; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">11<span>:</span>Eleven</div>
    <div class="kicker">Staff Access</div>
    <form id="accessForm">
      <input id="accessCode" type="password" inputmode="text" autocomplete="off" placeholder="Access code">
      <button type="submit">Enter</button>
      <p class="error" id="accessError">Incorrect code — try again.</p>
    </form>
  </div>
  <script>
    var STAFF_ACCESS_CODE = 'Eleven7367';
    document.getElementById('accessForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var entered = document.getElementById('accessCode').value;
      if (entered === STAFF_ACCESS_CODE) {
        window.location.href = 'app-content.html';
      } else {
        document.getElementById('accessError').style.display = 'block';
      }
    });
  </script>
</body>
</html>
