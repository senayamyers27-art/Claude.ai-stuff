version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"

  # Cyber Cert Study tooling (playwright for tests, wrangler for deploys).
  # Security fixes open immediately; version bumps are grouped weekly.
  - package-ecosystem: "npm"
    directory: "/cyber-study"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      study-site-tools:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "study-site"
