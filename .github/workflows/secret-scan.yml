name: Secret Scan

# Catches API tokens, keys, or credentials accidentally committed (e.g. a
# CLOUDFLARE_API_TOKEN pasted into a file instead of stored as a secret).
# This is a confidentiality control on the repo itself, independent of
# anything the live site or Worker does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
