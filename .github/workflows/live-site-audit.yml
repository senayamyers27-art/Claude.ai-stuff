name: Live Site Audit

on:
  schedule:
    - cron: "17 8 * * *" # ~03:17 America/Chicago
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests

      - name: Run live-site health/security checks
        id: health
        # Second argument is optional: set the WORKERS_DEV_URL repo variable
        # (Settings > Secrets and variables > Actions > Variables) to your
        # account's *.workers.dev URL for eleven-eleven-staff-api to get the
        # "still reachable" regression check; the audit runs fine without it.
        run: python3 scripts/live_site_audit.py https://11elevendallas.com "${{ vars.WORKERS_DEV_URL }}"

      - name: Set up Node
        if: always()
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install Lighthouse CI
        if: always()
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse against the live site
        id: lighthouse
        if: always()
        run: lhci autorun --config=./lighthouserc.live.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-lighthouse-reports
          path: .lighthouseci-results

      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const title = "Live site audit failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-audit",
            });
            const existing = issues.find(i => i.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled live-site audit failed on ${new Date().toISOString()}.\n\nSee the run for details: ${runUrl}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["live-audit"],
              });
            }
