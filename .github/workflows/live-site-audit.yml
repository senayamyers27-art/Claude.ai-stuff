name: Live Site Audit

on:
  schedule:
    - cron: "17 8 * * *" # ~03:17 America/Chicago
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests

      - name: Run live-site health/security checks
        id: health
        run: python3 scripts/live_site_audit.py https://11elevendallas.com

      - name: Set up Node
        if: always()
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install Lighthouse CI
        if: always()
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse against the live site
        id: lighthouse
        if: always()
        run: lhci autorun --config=./lighthouserc.live.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-lighthouse-reports
          path: .lighthouseci-results

      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = "Live site audit failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-audit",
            });
            const existing = issues.find(i => i.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled live-site audit failed on ${new Date().toISOString()}.\n\nSee the run for details: ${runUrl}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["live-audit"],
              });
            }
