name: OpenSSF Scorecard

# Scores the repository's supply-chain security practices (pinned dependencies, token
# permissions, branch protection, code review, signed releases and more) and shows the
# results under Security > Code scanning. See cyber-study/docs/GITHUB_SETTINGS.md for the
# settings that raise the score.

on:
  branch_protection_rule:
  schedule:
    - cron: "23 7 * * 2" # Tuesdays
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write        # publish the results to the public Scorecard API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: results.sarif
