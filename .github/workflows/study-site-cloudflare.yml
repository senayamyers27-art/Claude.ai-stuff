name: Study site Cloudflare settings

# Weekly drift check of the Cloudflare zone for the study site's domain: Always Use HTTPS,
# Full (strict) SSL, minimum TLS 1.2, TLS 1.3, HTTP/3, no 0-RTT, DNSSEC. Fails if anything
# drifted. Run it manually with "apply" ticked to fix the drift.
#
# Setup: repository secrets CLOUDFLARE_ZONE_TOKEN (Zone Settings: Edit, Zone: Read; add
# Zone: Edit to let "apply" turn on DNSSEC) and CLOUDFLARE_ZONE_ID. Skips until they exist.

on:
  schedule:
    - cron: "0 12 * * 3" # Wednesdays
  workflow_dispatch:
    inputs:
      apply:
        description: "Change settings that differ (otherwise only report)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      APPLY_FLAG: ${{ inputs.apply && '--apply' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Check (or apply) zone settings
        working-directory: cyber-study
        run: node tools/cloudflare-config.js $APPLY_FLAG
