name: D1 Nightly Backup

on:
  schedule:
    - cron: "11 9 * * *" # ~03:11 America/Chicago, after the retention cleanup cron
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    # Skipped automatically until CLOUDFLARE_API_TOKEN is added as a repo
    # secret (Settings -> Secrets and variables -> Actions). See
    # worker/README.md "Backups" for the token scope and account ID needed.
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Export D1 database
        working-directory: worker
        run: npx wrangler d1 export eleven-eleven-staff --remote --output=backup.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: d1-backup-${{ github.run_id }}
          path: worker/backup.sql
          retention-days: 35
