name: Study site API deploy

# Deploys the optional accounts API (cyber-study/api, a Cloudflare Worker with a D1 database)
# after "Study site CI" passes for a push to main: applies database migrations, then deploys.
#
# Does nothing until all of these exist:
#   secrets CLOUDFLARE_API_TOKEN (needs Workers Scripts: Edit, D1: Edit, Workers Routes: Edit)
#           CLOUDFLARE_ACCOUNT_ID, STUDY_API_D1_ID (from `wrangler d1 create cyber-cert-study`)
#   site.config.json "domain" and "apiOrigin" (https://api.<domain>)
# Optional secrets, copied into the Worker's encrypted secrets when present:
#   STUDY_API_EMAIL_KEY (Resend), STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
# Optional variables: STUDY_API_EMAIL_FROM, STUDY_API_R2_BUCKET, STRIPE_PRICE_PRO_MONTHLY,
#   STRIPE_PRICE_PRO_YEARLY, STRIPE_PRICE_PREMIUM_MONTHLY, STRIPE_PRICE_PREMIUM_YEARLY, STRIPE_PRICE_ORG_SEAT, STRIPE_TAX ("on" to enable Stripe Tax),
#   STRIPE_PORTAL_CONFIG (the Customer Portal configuration from the Stripe setup workflow)

on:
  workflow_run:
    workflows: ["Study site CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-site-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only tested pushes to main; pull-request code never runs with these secrets.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: study-api-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STUDY_API_D1_ID: ${{ secrets.STUDY_API_D1_ID }}
      STUDY_API_R2_BUCKET: ${{ vars.STUDY_API_R2_BUCKET }}
      STUDY_API_EMAIL_FROM: ${{ vars.STUDY_API_EMAIL_FROM }}
      STRIPE_PRICE_PRO_MONTHLY: ${{ vars.STRIPE_PRICE_PRO_MONTHLY }}
      STRIPE_PRICE_PRO_YEARLY: ${{ vars.STRIPE_PRICE_PRO_YEARLY }}
      STRIPE_PRICE_ORG_SEAT: ${{ vars.STRIPE_PRICE_ORG_SEAT }}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${{ vars.STRIPE_PRICE_PREMIUM_MONTHLY }}
      STRIPE_PRICE_PREMIUM_YEARLY: ${{ vars.STRIPE_PRICE_PREMIUM_YEARLY }}
      STRIPE_TAX: ${{ vars.STRIPE_TAX }}
      STRIPE_PORTAL_CONFIG: ${{ vars.STRIPE_PORTAL_CONFIG }}
      STUDY_API_ADMIN_EMAILS: ${{ vars.STUDY_API_ADMIN_EMAILS }}
    defaults:
      run:
        working-directory: cyber-study
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check setup
        id: ready
        run: |
          API=$(node -p 'require("./site.config.json").apiOrigin || ""')
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$API" ]; then
            echo "::notice::The accounts API isn't set up yet (see the comments in this workflow), so nothing was deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cyber-study/package-lock.json

      - name: Install wrangler
        if: steps.ready.outputs.ok == 'true'
        run: npm ci

      # The database id isn't secret. If STUDY_API_D1_ID is missing or doesn't hold one (a pasted name or account id,
      # say), look the "cyber-cert-study" database up by name with the Cloudflare token.
      - name: Check the Cloudflare token
        if: steps.ready.outputs.ok == 'true'
        run: |
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]"'"'")
          echo "::add-mask::$ACCOUNT"
          case "$CLOUDFLARE_API_TOKEN" in *[[:space:]]*) echo "::warning::CLOUDFLARE_API_TOKEN has a space or line break in it. Paste the token again with nothing before or after it.";; esac
          # Account tokens verify under the account, user tokens under /user; either answering "active" is fine.
          a=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/tokens/verify" | jq -r '.result.status // empty' 2>/dev/null || true)
          u=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify" | jq -r '.result.status // empty' 2>/dev/null || true)
          if [ "$a" = "active" ] || [ "$u" = "active" ]; then echo "The Cloudflare token is valid."; exit 0; fi
          echo "::error::Cloudflare doesn't accept CLOUDFLARE_API_TOKEN (status: ${a:-${u:-invalid}}). Make a new one: Cloudflare → My Profile → API Tokens → Create Token → \"Edit Cloudflare Workers\" template, add Account → D1 → Edit, create it, and copy the long token shown once (not the Global API Key or the token's name/ID). Paste it into GitHub → Settings → Secrets and variables → Actions → CLOUDFLARE_API_TOKEN → Update, then run Study site API deploy again."
          exit 1

      - name: Find the D1 database
        if: steps.ready.outputs.ok == 'true'
        env:
          # The "cyber-cert-study" database (Cloudflare → D1). Used when neither the secret nor a lookup gives an id.
          KNOWN_D1_ID: 8837b692-ac42-41e5-a1f3-22f7e405f1bb
        run: |
          UUID='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]"'"'")
          echo "::add-mask::$ACCOUNT"
          if printf '%s' "$STUDY_API_D1_ID" | grep -Eq "$UUID"; then echo "Using STUDY_API_D1_ID."; exit 0; fi
          res=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/d1/database?name=cyber-cert-study" || true)
          id=$(printf '%s' "$res" | jq -r '[.result[]? | select(.name == "cyber-cert-study") | .uuid][0] // empty' 2>/dev/null || true)
          if [ -z "$id" ]; then
            # Show Cloudflare's reason (error codes and messages, no secrets) so a wrong account id or a token
            # without D1 access is easy to spot, then carry on with the database's known id (an id isn't secret).
            echo "::warning::Couldn't look up the database by name. Cloudflare said: $(printf '%s' "$res" | jq -c '[.errors[]? | {code, message}]' 2>/dev/null || echo 'no JSON reply')"
            echo "::warning::If the next step fails too, check CLOUDFLARE_ACCOUNT_ID (Cloudflare → Workers & Pages → Account ID) and that the token has Account → D1 → Edit."
            id="$KNOWN_D1_ID"
            echo "STUDY_API_D1_ID_FOUND=$id" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "STUDY_API_D1_ID doesn't hold a database id; found \"cyber-cert-study\" by name."
          # A different name: the workflow's own env: block would win over a STUDY_API_D1_ID written here.
          echo "STUDY_API_D1_ID_FOUND=$id" >> "$GITHUB_ENV"

      - name: Generate Worker config
        if: steps.ready.outputs.ok == 'true'
        run: node tools/api-config.js

      - name: Apply database migrations
        if: steps.ready.outputs.ok == 'true'
        working-directory: cyber-study/api
        run: npx wrangler d1 migrations apply cyber-cert-study --remote --config wrangler.deploy.toml

      - name: Deploy Worker
        if: steps.ready.outputs.ok == 'true'
        working-directory: cyber-study/api
        run: npx wrangler deploy --config wrangler.deploy.toml

      - name: Create the IP hashing key once
        if: steps.ready.outputs.ok == 'true'
        working-directory: cyber-study/api
        # A random key the Worker uses to hash IP addresses in its logs (HMAC). It never leaves Cloudflare,
        # isn't stored in GitHub, and is only created when the Worker doesn't have one yet.
        run: |
          if ! npx wrangler secret list --config wrangler.deploy.toml | grep -q '"IP_HASH_KEY"'; then
            openssl rand -hex 32 | npx wrangler secret put IP_HASH_KEY --config wrangler.deploy.toml
          fi

      - name: Copy secrets into the Worker
        if: steps.ready.outputs.ok == 'true'
        working-directory: cyber-study/api
        env:
          EMAIL_API_KEY: ${{ secrets.STUDY_API_EMAIL_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          # Sign in with Google, Facebook and LinkedIn (docs/SOCIAL_SIGNIN.md). Each option appears once its id and secret are set.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          # AI support assistant (docs/SUPPORT_BOT.md). The Help widget's chat appears once this is set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The App Store and Google Play review account (docs/MOBILE_APPS.md): an email and a fixed 8-character code.
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          APP_REVIEW_CODE: ${{ secrets.APP_REVIEW_CODE }}
        run: |
          for NAME in EMAIL_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET TURNSTILE_SECRET_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET FACEBOOK_APP_ID FACEBOOK_APP_SECRET LINKEDIN_CLIENT_ID LINKEDIN_CLIENT_SECRET ANTHROPIC_API_KEY APP_REVIEW_EMAIL APP_REVIEW_CODE; do
            if [ -n "${!NAME}" ]; then printf '%s' "${!NAME}" | npx wrangler secret put "$NAME" --config wrangler.deploy.toml; fi
          done

      - name: Health check
        if: steps.ready.outputs.ok == 'true'
        run: |
          API=$(node -p 'require("./site.config.json").apiOrigin')
          # A custom domain attached for the first time needs a few minutes for its certificate, so wait up to 6.
          for i in $(seq 1 36); do
            if curl -fsS "$API/v1/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::$API/v1/health didn't respond after deploy. In Cloudflare → Workers & Pages → cyber-cert-study-api → Settings → Domains & Routes, check that ${API#https://} is listed and active; if Cloudflare DNS has an older record for that name, delete it and run this workflow again."
          exit 1
