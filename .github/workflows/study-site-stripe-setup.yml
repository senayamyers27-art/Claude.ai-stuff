name: Study site Stripe setup

# One-click Stripe setup. Run it by hand from the Actions tab, first with a test-mode key, later with the live key.
# Creates (or reuses) the Pro and Premium Pro products and their prices, the Customer Portal configuration and the
# webhook endpoint in the Stripe account that STRIPE_SECRET_KEY belongs to (cyber-study/tools/stripe-setup.js), then:
#   - with the optional SETUP_GITHUB_TOKEN secret (fine-grained, this repository, "Secrets" and "Variables":
#     Read and write), saves the four STRIPE_PRICE_* variables, STRIPE_PORTAL_CONFIG and, when the webhook is new, STRIPE_WEBHOOK_SECRET;
#   - without it, lists the price ids in the run summary. The webhook signing secret is never printed: reveal it on
#     the endpoint's page in the Stripe Dashboard.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-site-stripe-setup
  cancel-in-progress: false

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: study-api-production
    defaults:
      run:
        working-directory: cyber-study
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Create or update the Stripe objects
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GH_TOKEN: ${{ secrets.SETUP_GITHUB_TOKEN }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then echo "::error::Add the STRIPE_SECRET_KEY secret first."; exit 1; fi
          node tools/stripe-setup.js > "$RUNNER_TEMP/stripe.json"
          secret=$(jq -r '.webhook.secret // empty' "$RUNNER_TEMP/stripe.json")
          [ -n "$secret" ] && echo "::add-mask::$secret"
          mode=$(jq -r 'if .livemode then "live" else "test" end' "$RUNNER_TEMP/stripe.json")
          saved=no
          if [ -n "$GH_TOKEN" ]; then
            ok=yes
            for k in $(jq -r '.prices | keys[]' "$RUNNER_TEMP/stripe.json"); do
              gh variable set "$k" --repo "$GITHUB_REPOSITORY" --body "$(jq -r --arg k "$k" '.prices[$k]' "$RUNNER_TEMP/stripe.json")" || ok=no
            done
            gh variable set STRIPE_PORTAL_CONFIG --repo "$GITHUB_REPOSITORY" --body "$(jq -r '.portalConfig' "$RUNNER_TEMP/stripe.json")" || ok=no
            # Piped in, so the secret never appears in a process's command line.
            if [ -n "$secret" ]; then printf '%s' "$secret" | gh secret set STRIPE_WEBHOOK_SECRET --repo "$GITHUB_REPOSITORY" || ok=no; fi
            [ "$ok" = yes ] && saved=yes
          fi
          {
            echo "## Stripe setup ($mode mode)"
            echo ""
            echo "| Variable | Price id |"
            echo "|---|---|"
            jq -r '.prices | to_entries[] | "| `\(.key)` | `\(.value)` |"' "$RUNNER_TEMP/stripe.json"
            echo ""
            echo "- Customer Portal configuration: \`$(jq -r '.portal.id' "$RUNNER_TEMP/stripe.json")\` (default: $(jq -r '.portal.isDefault' "$RUNNER_TEMP/stripe.json"))"
            echo "- Webhook: \`$(jq -r '.webhook.url' "$RUNNER_TEMP/stripe.json")\` ($(jq -r 'if .webhook.created then "created" else "already existed" end' "$RUNNER_TEMP/stripe.json"))"
            echo ""
            if [ "$saved" = yes ]; then
              echo "Saved the price variables, STRIPE_PORTAL_CONFIG$( [ -n "$secret" ] && echo " and STRIPE_WEBHOOK_SECRET" ) to this repository."
            else
              echo "Add the price ids above as repository **variables**, and **STRIPE_PORTAL_CONFIG** = \`$(jq -r '.portalConfig' "$RUNNER_TEMP/stripe.json")\`. For **STRIPE_WEBHOOK_SECRET**, open the webhook in the Stripe Dashboard (Developers → Webhooks) and reveal its signing secret."
            fi
            echo ""
            echo "Then run **Study site API deploy** so the Worker picks up the new values."
            echo "Turn on Smart Retries and failed-payment emails in Stripe: Settings → Billing → Revenue recovery (not available through the API)."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/stripe.json"
