name: CodeQL

# Static analysis of the actual backend/frontend JS (worker/src, assets/js).
# There's no package.json anywhere in this repo, so there's no npm
# dependency tree for Dependabot to patch here — this is the real "auto
# auditing" coverage for the hand-written code itself (injection, unsafe
# regex, prototype pollution, etc.), not a substitute for dependency scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 10 * * 1" # weekly, Monday ~04:00 America/Chicago
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: javascript
          source-root: .

      - name: Autobuild
        uses: github/codeql-action/autobuild@5ba2889ada762081db2c4f32a729827dce632c7b # v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
