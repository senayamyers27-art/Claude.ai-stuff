name = "eleven-eleven-staff-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Routes this Worker on your existing domain at /api/* — same zone as the
# static site, so no CORS headers are needed and it can sit behind the same
# Cloudflare Access application that gates owner.html / host.html.
routes = [
  { pattern = "11elevendallas.com/api/*", zone_name = "11elevendallas.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "eleven-eleven-staff"
database_id = "dd243803-9c55-4dd5-96a3-674d3a37ff0a"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "718327ab06674a339a0d2572aa58d7db"

# Nightly cleanup of data past its retention window — see DATA_RETENTION.md.
# Cron runs in UTC always; 07:00 UTC is 2:00 AM America/Chicago during
# Central Daylight Time (roughly Mar-Nov). It drifts to 1:00 AM once Central
# Standard Time resumes in November — a cleanup job an hour off is harmless,
# so this isn't adjusted seasonally.
[triggers]
crons = ["0 7 * * *"] # ~02:00 America/Chicago (CDT)
