name = "eleven-eleven-staff-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Routes this Worker on your existing domain — same zone as the static site,
# so no CORS headers are needed. /api/* sits behind the Cloudflare Access
# application that gates owner.html / host.html; /public/* is deliberately
# NOT behind Access (it's the guest-facing booking API — real guests have no
# Cloudflare identity to authenticate with).
routes = [
  { pattern = "11elevendallas.com/api/*", zone_name = "11elevendallas.com" },
  { pattern = "11elevendallas.com/public/*", zone_name = "11elevendallas.com" },
  { pattern = "www.11elevendallas.com/api/*", zone_name = "11elevendallas.com" },
  { pattern = "www.11elevendallas.com/public/*", zone_name = "11elevendallas.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "eleven-eleven-staff"
database_id = "dd243803-9c55-4dd5-96a3-674d3a37ff0a"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "718327ab06674a339a0d2572aa58d7db"

# Nightly cleanup of data past its retention window — see DATA_RETENTION.md.
[triggers]
crons = ["0 9 * * *"] # 03:00 America/Chicago (CST)
